[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alvarez"
version = "1.0.0"
description = "Universal HUD, quota monitor, stream companion, and thought processor for Google Antigravity CLI"
readme = "README.md"
authors = [{ name = "Sir Gonyat & Antigravity Engineering Pair" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dsp = ["numpy>=1.20.0"]
test = ["pytest>=7.0.0"]

[project.scripts]
alvarez = "alvarez.cli.monitor:run_monitor"
alvarez-stream = "alvarez.cli.stream:run_stream"
alvarez-vis = "alvarez.cli.visualizer:run_visualizer"

[tool.setuptools.packages.find]
include = ["alvarez*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
